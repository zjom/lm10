# lm10 config: copy to ~/.config/lm10/lm10.ini (or pass -c PATH).
# Every key is optional; the values below are the built-in defaults.
# Quote a value to keep leading/trailing spaces.
# Any key can also be set for one run with -o [section.]key=value, e.g.
# lm10 -o width=40% -o colors.background=#000000 -o keys.Escape=cancel

[main]
font = Sans 13
prompt = "❯ "
placeholder = Search…
# pixels, or a percentage of the output width
width = 600
# visible rows; the window height follows from this and the font
lines = 8
padding = 14
row-padding = 8
border-width = 2
border-radius = 12
selection-radius = 8
show-counter = yes
# draw the -i icons, looked up in this freedesktop icon theme (then hicolor)
icons = yes
icon-theme = hicolor

[colors]
# #rrggbb or #rrggbbaa
background = #141415f2
border = #878787
text = #cdcdcd
match = #e8b589
selection = #333738
selection-text = #cdcdcd
selection-match = #e8b589
prompt = #6e94b2
input = #cdcdcd
placeholder = #606079
cursor = #cdcdcd
counter = #606079
separator = #252530

[keys]
# Key = action[+action...]: the key runs the actions in order. A key is
# Mod+...+Keysym with mods Control (Ctrl), Shift, Alt (Mod1) and Super (Logo,
# Mod4), and an xkb keysym name such as a, Return, BackSpace or plus. A later
# line for the same key replaces it, and "none" unbinds it.
#
# Built-in actions: cancel, delete-prev, delete-prev-word, delete-next,
# delete-next-word, delete-line-start, delete-line-end, delete-line,
# cursor-left, cursor-right, cursor-word-left, cursor-word-right,
# cursor-start, cursor-end, match-exec, match-next, match-prev.
# cancel and match-exec end the list.
#
# These take an argument in (), [], {} or <>, which ends at the first
# closing one, so pick a pair the argument doesn't contain:
#   change-prompt(TEXT)  replace the prompt
#   change-query(TEXT)   replace the query
#   reload(CMD)          sh -c CMD; its output (lines or JSON, as on stdin)
#                        replaces the entries
#   execute(CMD)         sh -c CMD, waiting for it to finish; its stdout goes
#                        to stderr
# In CMD these become the selected entry's, shell-quoted:
#   {} command line  {n} name  {q} query  {N} argv word N (0 is the command)
#   {N..M} words N to M, either end optional
#
# e.g. Control+r = change-prompt(📁 )+reload(fd -t d . ~)
#      Control+x = execute(rm -- {1..})+reload(ls)
Escape = cancel
Control+g = cancel
BackSpace = delete-prev
Shift+BackSpace = delete-prev
Control+h = delete-prev
Control+w = delete-prev-word
Control+BackSpace = delete-prev-word
Alt+BackSpace = delete-prev-word
Delete = delete-next
KP_Delete = delete-next
Control+d = delete-next
Control+Delete = delete-next-word
Alt+d = delete-next-word
Control+k = delete-line-end
Control+u = delete-line-start
Left = cursor-left
Control+b = cursor-left
Right = cursor-right
Control+f = cursor-right
Control+Left = cursor-word-left
Alt+b = cursor-word-left
Control+Right = cursor-word-right
Alt+f = cursor-word-right
Home = cursor-start
Control+a = cursor-start
End = cursor-end
Control+e = cursor-end
Return = match-exec
KP_Enter = match-exec
Control+n = match-next
Down = match-next
Tab = match-next
Control+p = match-prev
Up = match-prev
Shift+Tab = match-prev
