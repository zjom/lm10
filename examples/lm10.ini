# lm10 config: copy to ~/.config/lm10/lm10.ini (or pass -c PATH).
# Every key is optional; the values below are the built-in defaults.
# Quote a value to keep leading/trailing spaces.

[main]
font = Sans 13
prompt = "❯ "
placeholder = Search…
# pixels, or a percentage of the output width
width = 600
# visible rows; the window height follows from this and the font
lines = 8
padding = 14
row-padding = 8
border-width = 2
border-radius = 12
selection-radius = 8
show-counter = yes

[colors]
# #rrggbb or #rrggbbaa
background = #141415f2
border = #878787
text = #cdcdcd
match = #e8b589
selection = #333738
selection-text = #cdcdcd
selection-match = #e8b589
prompt = #6e94b2
input = #cdcdcd
placeholder = #606079
cursor = #cdcdcd
counter = #606079
separator = #252530
