# lm10 config: copy to ~/.config/lm10/lm10.ini (or pass -c PATH).
# Every key is optional; the values below are the built-in defaults.
# Quote a value to keep leading/trailing spaces.

[main]
font = Sans 13
prompt = "❯ "
placeholder = Search…
# pixels, or a percentage of the output width
width = 600
# visible rows; the window height follows from this and the font
lines = 8
padding = 14
row-padding = 8
border-width = 2
border-radius = 12
selection-radius = 8
show-counter = yes
# draw the -i icons, looked up in this freedesktop icon theme (then hicolor)
icons = yes
icon-theme = hicolor

[colors]
# #rrggbb or #rrggbbaa
background = #141415f2
border = #878787
text = #cdcdcd
match = #e8b589
selection = #333738
selection-text = #cdcdcd
selection-match = #e8b589
prompt = #6e94b2
input = #cdcdcd
placeholder = #606079
cursor = #cdcdcd
counter = #606079
separator = #252530

[keys]
# action = key [key ...]. Setting an action replaces all of its default keys;
# "none" unbinds it. A key is Mod+...+Keysym with mods Control (Ctrl), Shift,
# Alt (Mod1) and Super (Logo, Mod4), and an xkb keysym name such as a, Return,
# BackSpace or plus. If two actions name the same key, the later one wins.
cancel = Escape Control+g
delete-prev = BackSpace Shift+BackSpace Control+h
delete-prev-word = Control+w Control+BackSpace Alt+BackSpace
delete-next = Delete KP_Delete Control+d
delete-next-word = Control+Delete Alt+d
delete-line-end = Control+k
delete-line-start = Control+u
# unbound by default
delete-line = none
cursor-left = Left Control+b
cursor-right = Right Control+f
cursor-word-left = Control+Left Alt+b
cursor-word-right = Control+Right Alt+f
cursor-start = Home Control+a
cursor-end = End Control+e
match-exec = Return KP_Enter
match-next = Down Tab Control+n
match-prev = Up Shift+Tab Control+p
